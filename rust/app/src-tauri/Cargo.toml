[package]
name = "xiaodao-ime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "小岛AI输入法 Tauri 应用壳：托盘菜单 / 透明 HUD / 设置窗口"

[lib]
# Tauri 官方模板布局：二进制只调 lib 的 run()，方便未来接移动端与集成测试
name = "xiaodao_ime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建开关：关掉时 tauri-build 会置 `cfg(dev)`，webview 去连 devUrl(localhost:1420)，
# 打出来的包一开窗就是全白（HUD 与设置窗都空）。`pnpm tauri build` 由 CLI 自动带上
# `tauri/custom-protocol`；直接用 cargo 构建可跑的二进制必须显式加：
#   cargo build -p xiaodao-ime --release --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
xiaodao-core = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
