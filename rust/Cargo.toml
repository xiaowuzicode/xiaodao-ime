[workspace]
resolver = "2"
members = ["crates/core"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/xiaowuzicode/xiaodao-ime"

[workspace.dependencies]
xiaodao-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
